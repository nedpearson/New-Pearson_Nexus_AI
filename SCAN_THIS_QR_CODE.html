<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code - Pearson Nexus AI</title>
  <meta http-equiv="refresh" content="0; url=http://192.168.0.28:3001/qr">
  <style>
    body {
      margin: 0;
      padding: 40px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
    }
    .container {
      max-width: 600px;
    }
    h1 {
      font-size: 48px;
      margin: 0 0 20px 0;
    }
    p {
      font-size: 20px;
      margin: 10px 0;
    }
    a {
      color: white;
      text-decoration: underline;
    }
    .loader {
      border: 4px solid rgba(255,255,255,0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 30px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📱</h1>
    <p>Redirecting to QR Code page...</p>
    <div class="loader"></div>
    <p style="font-size: 16px; opacity: 0.9; margin-top: 40px;">
      If not redirected automatically, click:<br>
      <a href="http://192.168.0.28:3001/qr">http://192.168.0.28:3001/qr</a>
    </p>
  </div>
  
  <script>
    // Fallback redirect
    setTimeout(() => {
      window.location.href = 'http://192.168.0.28:3001/qr';
    }, 500);
  </script>
</body>
</html>
